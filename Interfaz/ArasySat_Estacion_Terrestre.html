<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c2362">
<title>ArasySat · Telemetría</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Paleta tomada del parche: noche orbital, crema de las letras, azul del satélite,
   rojo/blanco/azul de la bandera y verde de la Tierra. */
:root{
  --noche:#0c2362;--noche-2:#061236;--abismo:#030a22;
  --crema:#fff3b8;--tx:#f2f6ff;--tx2:#b9c7ee;
  --azul:#173f93;--rojo:#6b1a24;--verde:#0e5a44;
  --ex:#ff9a90;--ey:#72f0b1;--ez:#8fbaff;
  --mono:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Space Grotesk",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{background:var(--noche-2)}
body{position:relative;min-height:100vh;display:flex;flex-direction:column;padding:22px 40px 28px;
  background:linear-gradient(180deg,var(--noche),var(--noche-2));color:var(--tx);font-family:var(--sans)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stripe{position:absolute;inset:0 0 auto 0;height:5px;display:flex}
.stripe i{flex:1}
.stripe i:nth-child(1){background:#c4161c}
.stripe i:nth-child(2){background:#fff}
.stripe i:nth-child(3){background:#2431b0}

/* Encabezado */
header{display:flex;align-items:center;gap:20px;min-height:112px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px}
h1{font:700 46px/1 var(--sans);letter-spacing:-.015em;color:var(--crema)}
.logo{position:relative;width:96px;height:96px;flex:none}
.logo img{display:block;width:100%;height:100%;object-fit:contain}
.logo.empty{display:grid;place-items:center;border:2px dashed rgba(255,255,255,.45);border-radius:50%}
.logo.empty::after{content:"Logo";color:var(--tx2);font:500 13px var(--sans)}
.bar{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:10px;min-height:38px;padding:0 16px 0 12px;
  border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(3,10,34,.5);
  font:500 13px var(--sans);font-variant-numeric:tabular-nums}
#chipTxt{display:flex}
#chipTxt span+span{margin-left:10px;padding-left:10px;border-left:1px solid rgba(255,255,255,.28)}
.led{position:relative;width:10px;height:10px;flex:none}
.dot,.ring{position:absolute;inset:0;border-radius:50%}
.dot{background:#8fa3d6}
.dot.ok{background:#3ddc8f}
.dot.wait,.dot.late{background:#ffcf5a}
.dot.lost{background:#ff5a4a}
.ring{border:2px solid #3ddc8f;opacity:0}
.ring.go{animation:ping .8s ease-out}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(2.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.ring.go{animation:none}}

.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid rgba(255,255,255,.38);
  border-radius:10px;background:rgba(255,255,255,.06);color:var(--tx);font:700 14px var(--sans);cursor:pointer;
  transition:background .15s,color .15s,border-color .15s}
.btn svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover:not(:disabled){background:rgba(255,255,255,.16)}
.btn:focus-visible{outline:3px solid var(--crema);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--crema);border-color:var(--crema);color:#0b2057}
.btn.primary:hover:not(:disabled){background:#fff9d8}
.btn.on{background:var(--tx);border-color:var(--tx);color:#0b2057}
.btn.on:hover:not(:disabled){background:#fff}
.btn.danger:hover:not(:disabled){border-color:#ff8a7e;color:#ffc2ba}
.btn.danger.arm,.btn.danger.arm:hover:not(:disabled){background:#ff5a4a;border-color:#ff5a4a;color:#1d0605}
.cnt{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 6px;border-radius:10px;
  background:var(--crema);color:#0b2057;font:700 12px var(--sans);font-variant-numeric:tabular-nums}

/* Paneles. Los instrumentos crecen con la pantalla; el espacio que sobra se reparte entre ellos. */
main{flex:1;display:grid;grid-template-columns:262fr 246fr 246fr 336fr;grid-template-rows:minmax(0,1fr);gap:14px;min-height:600px}
.col{display:flex;flex-direction:column;gap:14px;min-height:0}
section{padding:14px;border-radius:14px;border:1px solid var(--lin);container-type:inline-size}
section.grow{display:flex;flex-direction:column}
.blue{background:var(--azul);--lin:rgba(91,141,239,.6)}
.red{background:var(--rojo);--lin:rgba(226,69,61,.65)}
.green{background:var(--verde);--lin:rgba(67,201,133,.55)}
.grow{flex:1}
.stack{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly}
.blk+.blk{margin-top:10px}
h2{font:700 clamp(20px,2.2vh,26px)/1.2 var(--sans);margin-bottom:2px}
h3{font:500 clamp(14px,1.55vh,17px) var(--sans);color:var(--tx2);margin:0 0 6px}

.row{--S:132px;display:flex;gap:12px;align-items:center}
@supports (width:1cqw){.row{--S:clamp(96px,min(calc((100vh - 372px)/3.2),calc((100cqw - 12px)*.5)),240px)}}
.w{width:var(--S);height:var(--S);flex:none;display:block;background:var(--abismo);border:1px solid rgba(255,255,255,.14);border-radius:12px}
.v{font:400 clamp(15px,calc(var(--S)*.115),24px)/1.55 var(--mono);white-space:pre}
.v i{font-style:normal;font-weight:700}
.v .x{color:var(--ex)}.v .y{color:var(--ey)}.v .z{color:var(--ez)}.v .k{color:var(--crema)}

.alt{background:var(--abismo);--lin:rgba(255,243,184,.5)}
#alt{font:700 clamp(44px,6.4vh,84px)/1 var(--mono);color:var(--crema);margin:12px 0 8px;white-space:nowrap}
#alt small{font:400 .4em var(--mono);color:var(--tx2);margin-left:6px}
#vv{font:400 clamp(14px,1.55vh,17px) var(--sans);color:var(--tx2)}
#vv b{font:400 clamp(15px,1.7vh,19px) var(--mono);color:var(--tx);margin-left:8px}
/* Fase de vuelo: cinco tramos en orden; los ya recorridos se tiñen y el actual se enciende */
.fase{display:flex;align-items:center;gap:12px;margin-top:12px}
.seg{flex:1;display:flex;gap:3px}
.seg i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.seg i.on{background:rgba(255,243,184,.5)}
.seg i.now{background:var(--crema)}
#faseTxt{min-width:7.2em;text-align:right;font:700 clamp(14px,1.55vh,17px) var(--sans);color:var(--crema)}

.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:clamp(9px,1.2vh,15px) 0;border-bottom:1px solid rgba(255,255,255,.16)}
.kv:last-child{border-bottom:0;padding-bottom:0}
.kv span{font:500 clamp(14px,1.55vh,17px) var(--sans);color:var(--tx2)}
.kv b{font:400 clamp(15px,1.7vh,19px) var(--mono)}

.sc{position:relative;height:clamp(14px,1.55vh,22px);border-radius:999px;margin:8px 5px 4px}
.t{background:linear-gradient(90deg,#4a6bff,#00c8ff,#fff700,#ff8a00,#d40000)}
.h{background:linear-gradient(90deg,#d9ecff,#2a6bff)}
.p{background:linear-gradient(90deg,#ffe4dc,#ff4d3a)}
.mk{position:absolute;top:50%;left:0;width:10px;height:clamp(26px,2.9vh,36px);transform:translate(-50%,-50%);
  background:var(--tx);border:2px solid var(--abismo);border-radius:6px;box-shadow:0 0 0 1px rgba(255,255,255,.75)}
.ends{display:flex;justify-content:space-between;margin:0 5px;font:400 clamp(11px,1.2vh,14px) var(--sans);color:var(--tx2)}
.amb .v{font:700 clamp(17px,1.95vh,26px)/1.3 var(--mono);margin-top:3px;white-space:normal}
.amb .v .sub{margin-left:12px;font:400 clamp(12px,1.45vh,15px) var(--mono);color:var(--tx2);white-space:nowrap}

/* Mapa y enlace */
.mapwrap{position:relative;flex:1;min-height:320px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.24);background:#0a1c52}
#map{position:absolute;inset:0;background:#0a1c52}
.mapmsg{position:absolute;left:12px;right:12px;bottom:36px;z-index:1000;padding:10px 14px;border-radius:10px;
  background:rgba(3,10,34,.85);border:1px solid rgba(255,255,255,.2);font:500 13px/1.4 var(--sans);pointer-events:none}
.pin{filter:drop-shadow(0 2px 2px #0006)}
.leaflet-container .leaflet-control-attribution{background:rgba(3,10,34,.75);color:var(--tx2)}
.leaflet-container .leaflet-control-attribution a{color:var(--crema)}
.leaflet-bar a{background-color:#0c2362;color:var(--tx);border-bottom-color:#2b4aa0}
.leaflet-bar a:hover,.leaflet-bar a:focus{background-color:#16348a;color:#fff}
.link{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px 14px;background:var(--abismo);--lin:rgba(255,255,255,.24)}
.link div{display:flex;flex-direction:column;gap:2px;min-width:0}
.link span{font:500 clamp(13px,1.45vh,15px) var(--sans);color:var(--tx2)}
.link b{font:400 clamp(15px,1.7vh,19px) var(--mono);white-space:nowrap}
.link small{margin-left:5px;font:400 .72em var(--mono);color:var(--tx2)}

@media (max-width:1180px){body{padding:22px 24px 24px}main{grid-template-columns:1fr 1fr;grid-template-rows:none}.blk+.blk{margin-top:18px}h2{margin-bottom:8px}}
@media (max-width:620px){body{padding:22px 16px 24px}main{grid-template-columns:1fr}h1{font-size:36px}.logo{width:76px;height:76px}.bar{margin-left:0}}
</style>
</head>
<body>
<div class="stripe" aria-hidden="true"><i></i><i></i><i></i></div>
<header>
  <div class="brand">
    <h1>ArasySat</h1>
    <!-- Espacio del logo: usa arasysat.png si está junto a este archivo y, si no, la copia incluida al final del script. -->
    <div class="logo" id="logo"><img id="logoImg" src="arasysat.png" alt="Logo de ArasySat" width="96" height="96"></div>
  </div>
  <div class="bar">
    <div class="chip" id="chip"><span class="led"><i class="dot" id="dot"></i><i class="ring" id="ring"></i></span><span id="chipTxt"></span></div>
    <button class="btn primary" id="bc" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
      <span id="bct">Conectar receptor</span>
    </button>
    <button class="btn" id="bd" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>
      <span>Demo</span>
    </button>
    <button class="btn danger" id="bl" type="button" title="Borra los datos registrados y vacía el panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      <span id="blt">Limpiar</span>
    </button>
    <button class="btn" id="be" type="button" disabled title="Descarga todos los paquetes registrados en un archivo CSV">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Exportar CSV</span>
      <b class="cnt" id="cnt" hidden>0</b>
    </button>
  </div>
</header>
<div class="sr" id="live" role="status" aria-live="polite"></div>

<main>
  <div class="col">
    <section class="blue grow">
      <h2>Movimiento</h2>
      <div class="stack">
        <div class="blk">
          <h3>Aceleración</h3>
          <div class="row"><svg class="w" id="acc" viewBox="0 0 132 132" role="img" aria-label="Vector de aceleración"></svg><div class="v" id="acv"></div></div>
        </div>
        <div class="blk">
          <h3>Giroscopio</h3>
          <div class="row">
            <svg class="w" viewBox="0 0 132 132" role="img" aria-label="Horizonte artificial">
              <defs><clipPath id="cg"><circle cx="66" cy="66" r="50"/></clipPath>
              <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2457e6"/><stop offset="1" stop-color="#7db4ff"/></linearGradient>
              <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9791f"/><stop offset="1" stop-color="#8a4510"/></linearGradient></defs>
              <g clip-path="url(#cg)"><g id="gh"><rect x="-100" y="-100" width="332" height="166" fill="url(#sk)"/><rect x="-100" y="66" width="332" height="166" fill="url(#gd)"/><ellipse cx="66" cy="66" rx="50" ry="16" fill="none" stroke="#ffffff66"/><line x1="-100" x2="232" y1="66" y2="66" stroke="#fff" stroke-width="2"/></g></g>
              <circle cx="66" cy="66" r="52" fill="none" stroke="#dfe8ff" stroke-width="4"/>
              <path d="M54 66h24M66 60v12" stroke="#fff3b8" stroke-width="2.5"/>
            </svg>
            <div class="v" id="gyv"></div>
          </div>
        </div>
        <div class="blk">
          <h3>Roll</h3>
          <div class="row">
            <svg class="w" viewBox="0 0 132 132" role="img" aria-label="Indicador de balanceo">
              <defs><clipPath id="cr"><circle cx="66" cy="66" r="46"/></clipPath></defs>
              <circle cx="66" cy="66" r="62" fill="#27396f"/>
              <g clip-path="url(#cr)"><g id="rh"><rect x="-100" y="-100" width="332" height="166" fill="#4a86d8"/><rect x="-100" y="66" width="332" height="166" fill="#8b5a33"/><line x1="-100" x2="232" y1="66" y2="66" stroke="#fff" stroke-width="2"/></g></g>
              <g id="tk"></g>
              <g id="rp"><path d="M66 20l-5 9h10z" fill="#fff3b8"/></g>
              <path d="M30 70h26l10 8 10-8h26" fill="none" stroke="#f2f6ff" stroke-width="3"/>
            </svg>
            <div class="v" id="rov"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="red grow">
      <h2>Brújula</h2>
      <div class="stack">
        <div class="blk">
          <h3>Magnetómetro</h3>
          <div class="row"><svg class="w" id="mag" viewBox="0 0 132 132" role="img" aria-label="Vector de campo magnético"></svg><div class="v" id="mgv"></div></div>
        </div>
        <div class="blk">
          <h3>Rumbo magnético</h3>
          <div class="row">
            <svg class="w" viewBox="0 0 132 132" role="img" aria-label="Brújula">
              <circle cx="66" cy="66" r="48" fill="none" stroke="#dfe8ff" stroke-width="3"/>
              <g font-family="Space Grotesk,system-ui,sans-serif" font-weight="700" font-size="15" text-anchor="middle" stroke="#030a22" stroke-width="4" stroke-linejoin="round" paint-order="stroke"><text x="66" y="23" fill="#ff9a90">N</text><text x="66" y="119" fill="#f2f6ff">S</text><text x="114" y="71" fill="#f2f6ff">E</text><text x="18" y="71" fill="#f2f6ff">W</text></g>
              <polygon id="ar" points="66,30 84,90 66,78 48,90" fill="#fff3b8" stroke="#030a22" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <div class="v" id="hv"></div>
          </div>
        </div>
      </div>
    </section>
    <section class="alt">
      <h2>Altura</h2>
      <div id="alt"></div>
      <div id="vv"></div>
      <div class="fase" id="fase" role="img" aria-label="Fase de vuelo: sin datos">
        <span class="seg"><i></i><i></i><i></i><i></i><i></i></span>
        <b id="faseTxt">Fase de vuelo: sin datos</b>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="green gps">
      <h2>GPS</h2>
      <div class="kv"><span>Satélites</span><b id="sat">--</b></div>
      <div class="kv"><span>Latitud</span><b id="lat">--</b></div>
      <div class="kv"><span>Longitud</span><b id="lon">--</b></div>
      <div class="kv"><span>Velocidad</span><b id="gv">--</b></div>
    </section>
    <section class="green grow amb">
      <h2>Ambiente</h2>
      <div class="stack">
        <div class="blk">
          <h3>Temperatura</h3>
          <div class="sc t"><b class="mk" id="tm"></b></div>
          <div class="ends"><span>-10°C</span><span>50°C</span></div>
          <div class="v" id="tv"></div>
        </div>
        <div class="blk">
          <h3>Humedad</h3>
          <div class="sc h"><b class="mk" id="hm"></b></div>
          <div class="ends"><span>0%</span><span>100%</span></div>
          <div class="v" id="hu"></div>
        </div>
        <div class="blk">
          <h3>Presión</h3>
          <div class="sc p"><b class="mk" id="pm"></b></div>
          <div class="ends"><span>800 hPa</span><span>1100 hPa</span></div>
          <div class="v" id="pv"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="col">
    <div class="mapwrap"><div id="map"></div><div class="mapmsg" id="mapmsg" hidden></div></div>
    <section class="link" aria-label="Enlace LoRa">
      <div><span>RSSI</span><b id="lkr">--</b></div>
      <div><span>SNR</span><b id="lks">--</b></div>
      <div><span>Perdidos</span><b id="lkp">--</b></div>
    </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const f=(v,d=1)=>Number.isFinite(v)?v.toFixed(d):'--';
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const p2=v=>String(v).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const hms=(d,s)=>[p2(d.getHours()),p2(d.getMinutes()),p2(d.getSeconds())].join(s);
const pl=k=>k+(k===1?' registro':' registros');

/* ---- Paquete del receptor LoRa: 26 campos separados por comas ----
   N, ax,ay,az, gx,gy,gz, mx,my,mz, tAHT, hum, tBMP, pres, alt, lat, lon, gpsAlt, sats, vel, rollK, pitchK, altK, velVertK, fase, vibG
   Después de cada "Recibido: ..." el receptor imprime "Paquete #N  RSSI: -85 dBm  SNR: 9.50" con la señal de ese paquete. */
const NF=26;
const PHASES=['Tierra','Ascenso','Estacionario','Descenso','Aterrizado'];

/* ---- Formato del CSV ----
   ';' con coma decimal es lo que abre directo Excel en español.
   Para Python, MATLAB o Google Sheets en inglés usa CSV_SEP=',' y CSV_DEC='.' */
const CSV_SEP=';',CSV_DEC=',';

/* ---- Rumbo magnético ----
   El paquete no trae rumbo: se calcula con el magnetómetro, compensando la inclinación con el roll y el pitch ya filtrados.
   No hay calibración. Si la brújula marca girada respecto a la lata, ajusta HDG_OFFSET (grados);
   si gira al revés, usa HDG_SIGN=-1. */
const HDG_OFFSET=0,HDG_SIGN=1;
function heading(mx,my,mz,roll,pitch){
  if(![mx,my,mz,roll,pitch].every(Number.isFinite)||!(Math.hypot(mx,my,mz)>0))return NaN;
  const r=roll*Math.PI/180,p=pitch*Math.PI/180;
  const xh=mx*Math.cos(p)+my*Math.sin(r)*Math.sin(p)+mz*Math.cos(r)*Math.sin(p);
  const yh=my*Math.cos(r)-mz*Math.sin(r);
  const a=(HDG_SIGN*Math.atan2(yh,xh)*180/Math.PI+HDG_OFFSET)%360;
  return a<0?a+360:a;
}

/* ---- Ejes 3D (aceleración y magnetómetro): Z vertical, Y hacia la izquierda ---- */
const AX={x:[.87,.5],y:[-.87,.5],z:[0,-1]};
const AXC={x:'#ff9a90',y:'#72f0b1',z:'#8fbaff'};
const OX=66,OY=74,LEN=48;
function axes(svg,id){
  let s=`<defs><marker id="tip-${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff3b8"/></marker></defs>`;
  for(const k of ['x','y','z']){
    const [ux,uy]=AX[k],c=AXC[k];
    s+=`<line x1="${OX}" y1="${OY}" x2="${OX+ux*LEN}" y2="${OY+uy*LEN}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`
     +`<line x1="${OX}" y1="${OY}" x2="${OX-ux*34}" y2="${OY-uy*34}" stroke="${c}" stroke-opacity=".5" stroke-width="2" stroke-linecap="round" stroke-dasharray="0.1 6"/>`
     +`<text x="${OX+ux*(LEN+10)}" y="${OY+uy*(LEN+10)+5}" text-anchor="middle" fill="${c}" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="15">${k.toUpperCase()}</text>`;
  }
  s+=`<circle cx="${OX}" cy="${OY}" r="3" fill="#f2f6ff"/><line id="v${id}" x1="${OX}" y1="${OY}" x2="${OX}" y2="${OY}" stroke="#fff3b8" stroke-width="2.5" marker-end="url(#tip-${id})"/>`;
  svg.innerHTML=s;
}
function vec(id,x,y,z,k){
  const e=$('v'+id);
  if(![x,y,z].every(Number.isFinite)){e.setAttribute('x2',OX);e.setAttribute('y2',OY);return}
  let dx=(x*AX.x[0]+y*AX.y[0]+z*AX.z[0])*k,dy=(x*AX.x[1]+y*AX.y[1]+z*AX.z[1])*k;
  const l=Math.hypot(dx,dy);if(l>56){dx*=56/l;dy*=56/l}
  e.setAttribute('x2',OX+dx);e.setAttribute('y2',OY+dy);
}
const xyz=(a,u,d)=>['x','y','z'].map((k,i)=>`<i class="${k}">${k}</i>:${f(a[i],d)}${u}`).join('\n');
axes($('acc'),'a');axes($('mag'),'m');

/* ---- Escala de balanceo ---- */
$('tk').innerHTML=[-60,-45,-30,-20,-10,0,10,20,30,45,60].map(a=>{
  const r=a*Math.PI/180,s=Math.sin(r),c=Math.cos(r),l=a%30===0?9:5;
  return `<line x1="${66+51*s}" y1="${66-51*c}" x2="${66+(51+l)*s}" y2="${66-(51+l)*c}" stroke="#f2f6ff" stroke-width="2"/>`}).join('');

/* ---- Mapa ---- */
const HOME=[-23.4,-58.4];
let map,marker,track,fix=false,tileBad=false;
function mapNote(){
  const t=!window.L?'El mapa necesita internet. El resto de los datos funciona igual.'
    :tileBad?'No se cargan las imágenes del mapa. Revisa la conexión a internet.'
    :!fix?'Esperando posición GPS.':'';
  const e=$('mapmsg');e.textContent=t;e.hidden=!t;
}
if(window.L){
  map=L.map('map').setView(HOME,6);
  const tiles=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}).addTo(map);
  tiles.on('tileerror',()=>{tileBad=true;mapNote()});
  tiles.on('tileload',()=>{if(tileBad){tileBad=false;mapNote()}});
  marker=L.marker([0,0],{icon:L.divIcon({className:'pin',iconSize:[44,60],iconAnchor:[22,58],
    html:'<svg viewBox="0 0 44 60" width="44" height="60"><path d="M22 58C22 58 3 34 3 21a19 19 0 0 1 38 0c0 13-19 37-19 37z" fill="#e3262b" stroke="#a01418" stroke-width="2"/><circle cx="22" cy="21" r="9" fill="#fff"/></svg>'})});
  track=L.polyline([],{color:'#fff3b8',weight:3}).addTo(map);
}
const mark=(id,v,a,b)=>{const e=$(id);e.style.display=Number.isFinite(v)?'':'none';e.style.left=clamp((v-a)/(b-a)*100,0,100)+'%'};

/* ---- Estado y registro de paquetes ---- */
const COLS=['paquete','acc_x_g','acc_y_g','acc_z_g','giro_x_deg_s','giro_y_deg_s','giro_z_deg_s','mag_x_uT','mag_y_uT','mag_z_uT',
  'temp_aht_C','humedad_pct','temp_bmp_C','presion_hPa','alt_baro_m','lat_deg','lon_deg','alt_gps_m','satelites','vel_gps_kmh',
  'roll_kalman_deg','pitch_kalman_deg','alt_kalman_m','vel_vertical_kalman_ms','fase','vibracion_g'];
const EMPTY=Array(NF).fill(NaN);
const OFF='Sin conexión. Conecta el receptor por USB (Chrome o Edge).';
const log=[];
let n=null,last=0,rssi=null,snr=null,pend=null,state=OFF,flashMsg='',flashUntil=0;
let lastN=null,lost=0,got=0;
let port,reader,closed,demo=null,t=0;

function chip(){
  const now=Date.now(),age=last?Math.round((now-last)/1000):0;
  const segs=now<flashUntil?[flashMsg]:last?[`Paquete ${n}`,rssi!==null?`${rssi} dBm`:'',`hace ${age} s`].filter(Boolean):[state];
  $('chipTxt').innerHTML=segs.map(s=>`<span>${s}</span>`).join('');
  $('dot').className='dot '+(!last?(port?'wait':'off'):age<=5?'ok':age<=15?'late':'lost');
}
function flash(msg){flashMsg=msg;flashUntil=Date.now()+3500;$('live').textContent=msg;chip();setTimeout(chip,3600)}
function pulse(){const r=$('ring');r.classList.remove('go');void r.offsetWidth;r.classList.add('go')}

/* Enlace: RSSI y SNR del último paquete, y paquetes perdidos (saltos en el número N, igual que cuenta el receptor). */
function drawLink(){
  $('lkr').innerHTML=rssi===null?'--':`${rssi}<small>dBm</small>`;
  $('lks').innerHTML=snr===null?'--':`${f(snr,1)}<small>dB</small>`;
  const k=got+lost;
  $('lkp').innerHTML=!k?'--':`${lost}<small>(${f(lost/k*100,1)} %)</small>`;
}
function countN(num){
  if(!Number.isFinite(num))return;
  got++;
  if(lastN!==null&&num>lastN+1)lost+=num-lastN-1;
  lastN=num;
}
function resetLink(){lastN=null;lost=0;got=0}

/* El receptor imprime el paquete y, en otra línea, su RSSI y SNR. Se asigna por número de paquete;
   si la línea no trae número (formato anterior) se asigna al último paquete si todavía no tiene uno, o al siguiente. */
function onLink(num,r,s){
  rssi=r;snr=Number.isFinite(s)?s:null;
  const x=log[log.length-1];
  if(x&&x.src==='serie'&&x.rssi===null&&(num===null?Date.now()-x.ms<1500:x.d[0]===num)){x.rssi=rssi;x.snr=snr}
  else pend={r:rssi,s:snr};
  chip();drawLink();
}
function record(d,src){
  const p=src==='demo'?{r:rssi,s:snr}:pend;
  log.push({ms:Date.now(),src,rssi:p?p.r:null,snr:p?p.s:null,d});
  if(src!=='demo')pend=null;
  btns();
}
function btns(){
  const k=log.length;
  $('be').disabled=!k;$('cnt').hidden=!k;$('cnt').textContent=k;
  if(armed)$('blt').textContent=`¿Limpiar ${pl(k)}?`;
}

/* ---- Dibujo de un paquete ---- */
function draw(d){
  const [N,ax,ay,az,gx,gy,gz,mx,my,mz,tAHT,hum,tBMP,pres,alt,lat,lon,gpsAlt,sats,vel,roll,pitch,altK,vvK,fase,vib]=d;
  const hdg=heading(mx,my,mz,roll,pitch);
  $('acv').innerHTML=xyz([ax,ay,az],'g',2)+'\n<i class="k">vib</i>:'+f(vib,2)+'g';
  vec('a',ax,ay,az,36);
  $('gyv').innerHTML=xyz([gx,gy,gz],'deg/s',1);
  $('gh').setAttribute('transform',`translate(0 ${(Number.isFinite(pitch)?pitch:0)*1.6}) rotate(${-(roll||0)} 66 66)`);
  $('rh').setAttribute('transform',`rotate(${-(roll||0)} 66 66)`);
  $('rp').setAttribute('transform',`rotate(${-(roll||0)} 66 66)`);
  $('rov').textContent=`${f(roll)}°\nPitch ${f(pitch)}°`;
  $('mgv').innerHTML=xyz([mx,my,mz],'uT',1);
  vec('m',mx,my,mz,.8);
  $('ar').setAttribute('transform',`rotate(${hdg||0} 66 66)`);
  $('hv').textContent=f(hdg)+'°';
  $('alt').innerHTML=f(Number.isFinite(altK)?altK:alt)+'<small>m</small>';
  $('vv').innerHTML='Velocidad vertical<b>'+f(vvK)+' m/s</b>';
  const fi=Math.round(fase),ok=fi>=0&&fi<PHASES.length;
  document.querySelectorAll('#fase .seg i').forEach((e,i)=>{e.className=!ok?'':i<fi?'on':i===fi?'now':''});
  $('faseTxt').textContent='Fase de vuelo: ' + (ok?PHASES[fi]:' sin datos');
  $('fase').setAttribute('aria-label','Fase de vuelo: '+(ok?PHASES[fi]:'sin datos'));
  $('sat').textContent=f(sats,0);$('lat').textContent=f(lat,5);$('lon').textContent=f(lon,5);
  $('gv').textContent=f(vel)+' km/h';
  $('tv').innerHTML=`<i class="k">AHT</i> ${f(tAHT,2)}°C<span class="sub">BMP ${f(tBMP,2)}°C</span>`;mark('tm',tAHT,-10,50);
  $('hu').textContent=f(hum,1)+'%';mark('hm',hum,0,100);
  $('pv').textContent=f(pres,1)+' hPa';mark('pm',pres,800,1100);
  if(map&&Number.isFinite(lat)&&Number.isFinite(lon)&&(lat||lon)){
    const ll=[lat,lon];
    if(!fix){marker.addTo(map);map.setView(ll,16);fix=true;mapNote()}
    marker.setLatLng(ll);track.addLatLng(ll);
    if(!map.getBounds().contains(ll))map.panTo(ll);
  }
}
function update(d,src){
  n=Number.isFinite(d[0])?d[0]:'?';last=Date.now();
  countN(d[0]);record(d,src);draw(d);pulse();chip();drawLink();
}

/* ---- Limpiar: el primer clic pide confirmación (4 s) para no borrar un vuelo por error ---- */
let armed=false,armT=null;
function arm(on){
  armed=on;clearTimeout(armT);
  $('bl').classList.toggle('arm',on);
  $('blt').textContent=on?`¿Limpiar ${pl(log.length)}?`:'Limpiar';
  if(on)armT=setTimeout(()=>arm(false),4000);
}
function clearAll(){
  log.length=0;pend=null;n=null;last=0;t=0;fix=false;rssi=null;snr=null;resetLink();
  if(map){marker.remove();track.setLatLngs([]);map.setView(HOME,6)}
  draw(EMPTY);btns();mapNote();drawLink();
  flash('Datos limpiados.');
}
$('bl').onclick=()=>{
  if(!log.length){clearAll();return}
  if(armed){arm(false);clearAll()}else arm(true);
};

/* ---- Exportar CSV ---- */
function exportCsv(){
  if(!log.length)return;
  const nf=v=>Number.isFinite(v)?String(v).replace('.',CSV_DEC):'';
  const nd=(v,d)=>Number.isFinite(v)?v.toFixed(d).replace('.',CSV_DEC):'';
  const t0=log[0].ms;
  const head=['hora','t_s','origen','rssi_dBm','snr_dB',...COLS,'fase_nombre','rumbo_calc_deg'];
  const rows=log.map(r=>{const d=new Date(r.ms),a=r.d;
    return [`${ymd(d)} ${hms(d,':')}`,nd((r.ms-t0)/1000,3),r.src,nf(r.rssi),nf(r.snr),...a.map(nf),
      PHASES[Math.round(a[24])]||'',nd(heading(a[7],a[8],a[9],a[20],a[21]),1)]});
  const text=[head,...rows].map(a=>a.join(CSV_SEP)).join('\r\n')+'\r\n';
  const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  const now=new Date(),a=document.createElement('a');
  a.href=url;a.download=`ArasySat_${ymd(now).replace(/-/g,'')}_${hms(now,'')}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  flash(`CSV exportado (${pl(log.length)}).`);
}
$('be').onclick=exportCsv;

/* ---- Puerto serie: el receptor imprime "Recibido: ..." y "Paquete #N  RSSI: ...  SNR: ..." a 115200 ---- */
function line(s){
  let m;
  if((m=s.match(/^Paquete\s*#\s*(\d+).*?RSSI:\s*(-?\d+).*?SNR:\s*(-?\d+(?:\.\d+)?)/))){onLink(+m[1],+m[2],+m[3]);return}
  if((m=s.match(/RSSI:\s*(-?\d+)/))){onLink(null,+m[1],NaN);return}
  if(/^Error/i.test(s)){state='Receptor: '+s;chip();$('live').textContent=state;return}
  if(/^Receptor listo/i.test(s)){state='Receptor listo. Esperando paquetes…';chip();return}
  if(s.startsWith('Recibido:'))s=s.slice(9);
  else if(!/^[-\d]/.test(s))return;
  const p=s.split(',');
  if(p.length===NF)update(p.map(parseFloat),'serie');
}
async function connect(){
  if(!('serial' in navigator)){state='Este navegador no admite USB serie. Abre el panel en Chrome o Edge.';chip();return}
  try{port=await navigator.serial.requestPort()}catch(e){port=null;return}
  try{await port.open({baudRate:115200})}catch(e){port=null;state='No se pudo abrir el puerto. Cierra otros programas que lo usen e inténtalo de nuevo.';chip();return}
  if(demo)toggleDemo();
  rssi=null;snr=null;pend=null;resetLink();drawLink();
  $('bct').textContent='Desconectar';state='Conectado. Esperando paquetes…';chip();
  const dec=new TextDecoderStream();
  closed=port.readable.pipeTo(dec.writable).catch(()=>{});
  reader=dec.readable.getReader();
  let buf='';
  try{for(;;){const {value,done}=await reader.read();if(done)break;buf+=value;let i;
    while((i=buf.indexOf('\n'))>=0){line(buf.slice(0,i).trim());buf=buf.slice(i+1)}}}catch(e){}
  try{await closed;await port.close()}catch(e){}
  port=null;last=0;rssi=null;snr=null;drawLink();$('bct').textContent='Conectar receptor';
  state=OFF;chip();
}
$('bc').onclick=()=>port?reader.cancel().catch(()=>{}):connect();

/* ---- Modo demo: ciclo de 70 s con las cinco fases; el campo magnético sale del rumbo y la inclinación simulados ---- */
function demoPacket(k){
  const s=k/8,c=(k-1)%70,fase=c<10?0:c<30?1:c<45?2:c<65?3:4;
  const air=fase>0&&fase<4,a=air?1:.08,R=Math.PI/180;
  const h=fase===1?(c-10)*5:fase===2?100+1.5*Math.sin(s):fase===3?100-(c-45)*5:0;
  const vv=fase===1?5:fase===3?-5:0,vib=[.02,.35,.06,.12,.01][fase];
  const roll=25*a*Math.sin(s),pitch=12*a*Math.cos(s*.7),hd=(k*5)%360;
  const th=pitch*R,ph=roll*R,ps=hd*R;
  const a0=20*Math.cos(ps),b0=20*Math.sin(ps),c0=-28;
  const a1=Math.cos(th)*a0-Math.sin(th)*c0,c1=Math.sin(th)*a0+Math.cos(th)*c0;
  const tA=24+3*Math.sin(s/5),g=air?1:.05;
  return [k,
    -Math.sin(th)+.3*vib*Math.sin(k*5),Math.sin(ph)*Math.cos(th)+.3*vib*Math.sin(k*3),Math.cos(ph)*Math.cos(th)+.3*vib*Math.sin(k*7),
    30*g*Math.sin(s),20*g*Math.cos(s),10*g*Math.sin(s/2),
    a1,Math.cos(ph)*b0+Math.sin(ph)*c1,-Math.sin(ph)*b0+Math.cos(ph)*c1,
    tA,55+10*Math.sin(s/4),tA+.4+.1*Math.sin(s),1004-.12*h+.3*Math.sin(s/6),h+.6*Math.sin(s*2),
    -25.2637+.002*Math.sin(s/3),-57.5759+.002*Math.cos(s/3),h+3+1.5*Math.sin(s*1.3),air?9:7,air?6+2*Math.sin(s):0,
    roll,pitch,h,vv,fase,vib];
}
function toggleDemo(){
  if(demo){clearInterval(demo);demo=null;$('bd').classList.remove('on');$('bd').setAttribute('aria-pressed','false');last=0;rssi=null;snr=null;drawLink();chip();return}
  $('bd').classList.add('on');$('bd').setAttribute('aria-pressed','true');resetLink();pend=null;
  demo=setInterval(()=>{t++;rssi=-68-t%7;snr=9+(t%5)/2;update(demoPacket(t),'demo')},1000);
}
$('bd').onclick=toggleDemo;
